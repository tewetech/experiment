<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR Super Cepat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        /* Komentar: Styling untuk zona drag and drop */
        #dropArea {
            border: 3px dashed #60a5fa; /* Biru cerah untuk menarik perhatian */
            transition: border-color 0.3s, background-color 0.3s;
        }
        /* Komentar: Status saat file diseret di atas area */
        #dropArea.dragover {
            border-color: #10b981; /* Hijau */
            background-color: #f0fdf4; /* Latar belakang sangat terang */
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 sm:p-8">
    
    <div class="max-w-3xl mx-auto bg-white shadow-2xl rounded-xl p-6 lg:p-8">
        
        <h1 class="text-3xl font-extrabold text-indigo-700 mb-6 text-center">
            🚀 OCR Gambar ke Teks Super Cepat
        </h1>
        
        <div id="dropArea" class="mb-8 p-6 rounded-lg text-center cursor-pointer hover:bg-gray-50">
            <input type="file" id="imageInput" accept="image/*" class="hidden">
            <p class="text-xl font-medium text-gray-700 mb-2">
                **Seret & Jatuhkan Gambar di Sini**
            </p>
            <p class="text-sm text-gray-500 mb-4">atau</p>
            <button onclick="document.getElementById('imageInput').click()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition duration-300 shadow-md">
                Pilih File Gambar
            </button>
            <p id="placeholderText" class="text-gray-400 mt-4 text-sm">Belum ada gambar yang dipilih.</p>
        </div>

        <div class="mb-8">
            <img id="imagePreview" src="" alt="Pratinjau Gambar" class="max-w-full max-h-64 object-contain rounded-md shadow-lg border-2 border-gray-200 mx-auto hidden">
        </div>
        
        <div class="flex flex-col items-center mb-8">
            <button id="convertButton" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-full text-lg transition duration-300 shadow-lg disabled:bg-gray-400" disabled>
                ✨ KONVERSI SEKARANG
            </button>
            
            <div id="loadingArea" class="mt-4 w-full hidden">
                <div class="flex items-center justify-center text-purple-600 mb-2">
                    <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-purple-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <span id="progressStatus" class="font-medium">Memproses...</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-3">
                    <div id="progressBar" class="bg-purple-600 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div>
            <h2 class="text-xl font-bold text-gray-800 mb-3">Hasil Teks</h2>
            <textarea id="resultText" rows="10" class="w-full p-4 border-2 border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 bg-gray-50 font-mono text-sm resize-none" placeholder="Teks hasil konversi akan muncul di sini..." readonly></textarea>
            
            <button id="copyButton" class="mt-3 bg-gray-700 hover:bg-gray-800 text-white font-bold py-2 px-4 rounded-lg transition duration-300 disabled:bg-gray-400 flex items-center" disabled>
                📋 Salin Teks
            </button>
            <p id="copyStatus" class="mt-2 text-sm text-green-600 hidden">Teks berhasil disalin!</p>
        </div>
        
    </div>

    <script>
        // Komentar: Mendapatkan referensi elemen DOM
        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        const placeholderText = document.getElementById('placeholderText');
        const convertButton = document.getElementById('convertButton');
        const resultText = document.getElementById('resultText');
        const loadingArea = document.getElementById('loadingArea');
        const progressBar = document.getElementById('progressBar');
        const progressStatus = document.getElementById('progressStatus');
        const copyButton = document.getElementById('copyButton');
        const copyStatus = document.getElementById('copyStatus');
        const dropArea = document.getElementById('dropArea');
        
        let selectedFile = null;

        // Komentar: Fungsi umum untuk menampilkan pratinjau dan mengaktifkan tombol
        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) {
                alert('File yang dipilih bukan gambar.');
                return;
            }
            
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                imagePreview.src = e.target.result;
                imagePreview.classList.remove('hidden');
                placeholderText.classList.add('hidden');
                convertButton.disabled = false;
                resultText.value = '';
                copyButton.disabled = true;
                copyStatus.classList.add('hidden');
            };
            reader.readAsDataURL(selectedFile);
        }

        // --- Event Listener untuk Input File dan Drag & Drop ---

        // Komentar: Listener untuk input file standar
        imageInput.addEventListener('change', (event) => {
            handleFile(event.target.files[0]);
        });

        // Komentar: Mencegah perilaku default browser
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults (e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // Komentar: Menambahkan kelas visual saat file diseret di atas area
        ['dragenter', 'dragover'].forEach(eventName => {
            dropArea.addEventListener(eventName, () => dropArea.classList.add('dragover'), false);
        });

        // Komentar: Menghilangkan kelas visual saat file meninggalkan area
        ['dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, () => dropArea.classList.remove('dragover'), false);
        });

        // Komentar: Menangani file yang dijatuhkan
        dropArea.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        }, false);

        // --- Event Listener untuk Tombol Konversi (Logika OCR Tesseract.js) ---
        convertButton.addEventListener('click', async () => {
            if (!selectedFile) return;

            // Komentar: Nonaktifkan tombol dan tampilkan loading
            convertButton.disabled = true;
            copyButton.disabled = true;
            resultText.value = 'Memulai proses OCR... Harap tunggu.';
            loadingArea.classList.remove('hidden');
            copyStatus.classList.add('hidden');

            try {
                // Komentar: Membuat worker Tesseract
                const worker = await Tesseract.createWorker({
                    // Komentar: Logger untuk memperbarui progress bar secara real-time
                    logger: m => {
                        const statusMap = {
                            'loading tesseract core': 'Memuat core Tesseract...',
                            'initializing api': 'Menginisialisasi API...',
                            'loading language traineddata': 'Memuat data bahasa (eng+ind)...',
                            'recognizing': `Menganalisis teks: ${Math.round(m.progress * 100)}%`
                        };
                        
                        progressStatus.textContent = statusMap[m.status] || m.status;

                        if (m.status === 'recognizing') {
                            progressBar.style.width = `${Math.round(m.progress * 100)}%`;
                        } else if (m.status === 'loading language traineddata') {
                            // Komentar: Mengatur progress awal saat data bahasa dimuat
                            progressBar.style.width = '20%';
                        }
                    }
                });

                // Komentar: Mengatur bahasa (English dan Indonesian)
                await worker.loadLanguage('eng+ind');
                await worker.initialize('eng+ind');

                // Komentar: Menjalankan OCR
                const { data: { text } } = await worker.recognize(selectedFile);

                // Komentar: Menampilkan hasil
                resultText.value = text.trim();
                copyButton.disabled = false;
                
                await worker.terminate(); // Komentar: Hentikan worker untuk membebaskan memori

            } catch (error) {
                console.error('OCR Error:', error);
                resultText.value = 'Terjadi kesalahan saat OCR. (Cek konsol browser untuk detail).';
            } finally {
                // Komentar: Sembunyikan loading dan aktifkan kembali tombol
                loadingArea.classList.add('hidden');
                convertButton.disabled = false;
                progressBar.style.width = '0%';
            }
        });

        // --- Event Listener untuk Tombol Salin Teks ---
        copyButton.addEventListener('click', () => {
            resultText.select();
            resultText.setSelectionRange(0, 99999);
            
            navigator.clipboard.writeText(resultText.value).then(() => {
                copyStatus.textContent = 'Teks berhasil disalin!';
                copyStatus.classList.remove('hidden');
                setTimeout(() => {
                    copyStatus.classList.add('hidden');
                }, 3000);
            }).catch(err => {
                console.error('Gagal menyalin:', err);
                copyStatus.textContent = 'Gagal menyalin teks.';
                copyStatus.classList.remove('hidden');
            });
        });
    </script>
</body>
</html>
