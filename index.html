<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Link Undangan">
    <title>Link Undangan | Tewe Tech</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/tewetech/favicon/refs/heads/main/wedding.png">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/tewetech/favicon/refs/heads/main/wedding.png">
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Link%20Undangan%22%2C%22short_name%22%3A%22Undangan%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%231a1a1a%22%2C%22theme_color%22%3A%22%231a1a1a%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fraw.githubusercontent.com%2Ftewetech%2Ffavicon%2Frefs%2Fheads%2Fmain%2Fwedding.png%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fpng%22%7D%2C%7B%22src%22%3A%22https%3A%2F%2Fraw.githubusercontent.com%2Ftewetech%2Ffavicon%2Frefs%2Fheads%2Fmain%2Fwedding.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        html, body {
            font-family: 'Poppins', sans-serif;
            background-color: #1a1a1a;
            color: #d4a373;
            -webkit-tap-highlight-color: transparent;
        }
        .bg-batik {
            background-image: url('https://www.transparenttextures.com/patterns/batik-fabric.png');
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
        .font-vibes {
            font-family: 'Great Vibes', cursive;
        }
        .theme-panel {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid #8b5e34;
        }
        .theme-input {
            background: rgba(26, 26, 26, 0.8);
            border: 1px solid #8b5e34;
            color: #d4a373;
        }
        .theme-input:focus {
            outline: none;
            border-color: #d4a373;
            box-shadow: 0 0 0 1px #d4a373;
        }
    </style>
</head>
<body class="bg-batik w-full min-h-screen flex flex-col justify-between antialiased selection:bg-[#8b5e34]/30">

    <main class="w-full max-w-md mx-auto px-4 pt-8 pb-28 flex-1 flex flex-col justify-start gap-6">
        <div class="flex flex-col items-center justify-center gap-2 py-4 text-center">
            <h1 class="font-vibes text-5xl text-white tracking-wider">Link Otomatis</h1>
            <p class="text-sm text-[#d4a373] font-serif italic">Buat tautan undangan untuk tamu Anda</p>
            <div class="h-1 w-20 bg-[#8b5e34] mx-auto mt-2"></div>
        </div>

        <div class="theme-panel w-full rounded-2xl p-6 shadow-2xl flex flex-col gap-5">
            <div class="flex flex-col gap-2">
                <label class="text-xs font-semibold uppercase tracking-widest text-[#d4a373] flex items-center gap-2">
                    <i class="fa-solid fa-globe"></i> Link Utama
                </label>
                <input type="url" id="mainUrl" placeholder="https://wedding-tewe.netlify.app/" class="theme-input w-full px-4 py-3 rounded-xl text-sm placeholder-gray-500 transition-all duration-300">
            </div>

            <div class="flex flex-col gap-2">
                <label class="text-xs font-semibold uppercase tracking-widest text-[#d4a373] flex items-center gap-2">
                    <i class="fa-solid fa-user"></i> Nama Tamu
                </label>
                <input type="text" id="targetName" placeholder="Contoh: Tri W" class="theme-input w-full px-4 py-3 rounded-xl text-sm placeholder-gray-500 transition-all duration-300">
            </div>
        </div>

        <div class="theme-panel w-full rounded-2xl p-6 shadow-2xl flex flex-col gap-5">
            <div class="flex items-center justify-between border-b border-[#8b5e34] pb-3">
                <span class="text-xs font-semibold uppercase tracking-widest text-[#d4a373] flex items-center gap-2">
                    <i class="fa-solid fa-square-poll-horizontal"></i> Hasil Generator
                </span>
                <span id="toast" class="text-xs text-green-400 font-medium opacity-0 transition-opacity duration-300 flex items-center gap-1">
                    <i class="fa-solid fa-circle-check"></i> Tersalin!
                </span>
            </div>
            
            <div id="resultContainer" class="theme-input w-full min-h-[60px] px-4 py-4 rounded-xl text-sm text-gray-300 break-all select-all flex items-center">
                ...
            </div>

            <button id="copyBtn" class="w-full bg-[#8b5e34] hover:bg-[#6f4a27] text-white font-bold py-4 px-4 rounded-full text-sm transition-all duration-300 border border-[#d4a373] shadow-lg active:scale-95 flex items-center justify-center gap-2 mt-1">
                <i class="fa-regular fa-copy"></i> Salin Tautan
            </button>
        </div>
    </main>

    <div class="fixed bottom-0 left-0 right-0 w-full max-w-md mx-auto px-4 z-50">
        <nav class="theme-panel w-full border-b-0 rounded-t-3xl px-6 py-4 shadow-[0_-10px_40px_rgba(0,0,0,0.5)] flex items-center justify-around bg-black/80">
            <button class="flex flex-col items-center gap-1 text-[#d4a373] hover:text-white transition-colors">
                <i class="fa-solid fa-house-chimney text-xl"></i>
                <span class="text-[10px] font-medium tracking-wider">Home</span>
            </button>
            <button id="installBtn" class="hidden flex-col items-center gap-1 text-[#d4a373] hover:text-white transition-colors">
                <i class="fa-solid fa-download text-xl"></i>
                <span class="text-[10px] font-medium tracking-wider">Instal</span>
            </button>
            <button onclick="document.getElementById('targetName').value=''; document.getElementById('mainUrl').value=localStorage.getItem('savedMainUrl') || ''; updateResult();" class="flex flex-col items-center gap-1 text-gray-400 hover:text-red-400 transition-colors">
                <i class="fa-solid fa-trash-can text-xl"></i>
                <span class="text-[10px] font-medium tracking-wider">Reset</span>
            </button>
        </nav>
    </div>

    <script>
        const mainUrlInput = document.getElementById('mainUrl');
        const targetNameInput = document.getElementById('targetName');
        const resultContainer = document.getElementById('resultContainer');
        const copyBtn = document.getElementById('copyBtn');
        const toast = document.getElementById('toast');
        const installBtn = document.getElementById('installBtn');

        if (localStorage.getItem('savedMainUrl')) {
            mainUrlInput.value = localStorage.getItem('savedMainUrl');
        }

        function updateResult() {
            let mainUrl = mainUrlInput.value.trim();
            const targetName = targetNameInput.value.trim();

            if (!mainUrl) {
                resultContainer.textContent = '...';
                resultContainer.classList.add('text-gray-500');
                return;
            }

            resultContainer.classList.remove('text-gray-500');
            localStorage.setItem('savedMainUrl', mainUrl);

            if (!mainUrl.endsWith('/')) {
                const urlObj = new URL(mainUrl.startsWith('http') ? mainUrl : 'https://' + mainUrl);
                if (urlObj.pathname === '') {
                    mainUrl += '/';
                }
            }

            if (!targetName) {
                resultContainer.textContent = mainUrl;
                return;
            }

            const separator = mainUrl.includes('?') ? '&' : '?';
            const finalUrl = mainUrl + separator + 'to=' + encodeURIComponent(targetName);
            resultContainer.textContent = finalUrl;
        }

        function triggerCopy() {
            const textToCopy = resultContainer.textContent;
            if (textToCopy === '...' || !textToCopy) return;

            navigator.clipboard.writeText(textToCopy).then(() => {
                toast.classList.remove('opacity-0');
                toast.classList.add('opacity-100');
                
                copyBtn.classList.remove('bg-[#8b5e34]', 'hover:bg-[#6f4a27]', 'border-[#d4a373]');
                copyBtn.classList.add('bg-green-600', 'border-green-400');
                copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> Berhasil Disalin';

                setTimeout(() => {
                    toast.classList.remove('opacity-100');
                    toast.classList.add('opacity-0');
                    
                    copyBtn.classList.remove('bg-green-600', 'border-green-400');
                    copyBtn.classList.add('bg-[#8b5e34]', 'hover:bg-[#6f4a27]', 'border-[#d4a373]');
                    copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i> Salin Tautan';
                }, 2000);
            });
        }

        mainUrlInput.addEventListener('input', updateResult);
        targetNameInput.addEventListener('input', updateResult);
        copyBtn.addEventListener('click', triggerCopy);

        updateResult();

        const swCode = "self.addEventListener('fetch', function(event) {});";
        const blob = new Blob([swCode], { type: 'application/javascript' });
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(URL.createObjectURL(blob));
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
            installBtn.classList.add('flex');
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.classList.remove('flex');
                    installBtn.classList.add('hidden');
                }
                deferredPrompt = null;
            }
        });
    </script>
</body>
</html>
